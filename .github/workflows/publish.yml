name: Publish to Comfy registry

on:
  workflow_dispatch:
  release:
    types:
      - edited
      - published

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: github.event.action == 'published' || (github.event.action == 'edited' && github.event.release.prerelease == false && github.event.changes.prerelease.from == true)
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
